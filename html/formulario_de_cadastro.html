<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulario de Cadastro</h1>
    <form action="" method="post">
        <br><br>
        <label for="nome">Nome</label>
        <input 
            type="nome"
            id="nome"
            name="nome"
            required
        >
        <br><br>        
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="exemplo@dominio.com"
        >
        <br><br>
        <label for="telefone">telefone</label>
        <input
            type="telefone"
            id="telefone"
            name="telefone"
            required
            placeholder="(XX) XXXXX-XXXX"
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
        >
        <br><br>
        <label for="idade">Idade</label>
        <input
            type="idade"
            id="idade"
            name="idade"
            required
            min="18"
            max="120"
            step="1"
            
        >
        <br><br>
        <label for="nascimento">Nascimento</label>
        <input
            type=""nascimento
            id="nascimento"
            name="nascimento"
            required
            min=""
            max=""
            
        >
        <br><br>
        <label for="website">Website</label>
        <input
            type="url"
            id="website"
            name="website"
            placeholder="Seu site www.exemplo.com"
        >
        <br><br>
        <label for="comentarios">Comentario</label>
        <textarea
            id="comentarios"
            name="comentarios"
            rows="4"
            cols="50"
            maxlength="500"
            placeholder=""
        ></textarea>
        <br><br>

        <button type="submit">Cadastrar</button>
            
            
    </form>
    
</body>
</html>
